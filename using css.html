<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

    <style>
        h2 {
            color: blueviolet;
            text-decoration: underline wavy green;

        }

        .text {
            color: aqua;
            font-size: 30px;
            border: 1px solid crimson;
            /* font-family: 'Courier New', Courier, monospace; */
        }

        #mytext {
            background-color: yellow;
            color: blue;
            font-weight: bold;
            font-size: 15px;
        }

        h3 {
            color: blue !important;
        }

        .myclass {
            color: brown;
        }

        #myid {
            color: blueviolet;
        }
    </style>
</head>

<body>

    <h1 style="color: rgb(118, 6, 6); font-size: 40px;">inline css is used to style individual tag only</h1>

    <h2>Internal css is used to style multiple tag at once</h2>

    <h2 class="text">Name Selector is used to select element by their tag name</h2>

    <p class="text">Class selector is used to element bt their class name</p>

    <p id="mytext">Id selector is used to select elementby their id name</p>

    <h3 class="myclass" id="myid" style="color: coral;">Selector priority</h3>
    <button class="btn">Submit</button>

</body>

</html>
