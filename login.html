<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <link
        href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic"
        rel="stylesheet" />

    <style>
        * {
            font-family: Roboto;
        }

        .card {
            /* border: 2px solid red; */
            width: 20%;
            background-color: white;
            border-radius: 10px;
            padding: 20px;

            /* x-offset y-offset blur size color */
            box-shadow: 3px 3px 5px 0px #0000006b;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;

            /* background-color: lightgray; */
            /* background-image: linear-gradient(48deg, #aeaeff, #ffc3c3, #ffffb2); */

            /* background-image: url('https://wallpapers.com/images/featured/4k-desk-background-mqbtzik2pf2qebdt.jpg'); */
            /* background-size: cover; */

            background-image: linear-gradient(48deg, #ffffff74, #ffffff6d),
                url('https://wallpapers.com/images/featured/4k-desk-background-mqbtzik2pf2qebdt.jpg');

        }

        .form-title {
            text-align: center;
            font-size: 30px;
        }

        .text-input {
            display: block;
            width: 100%;
            padding: 10px 20px;
            border-radius: 5px;
            box-sizing: border-box;
            margin-bottom: 30px;
            margin-top: 5px;
            border: none;
            border: 1px solid black;
        }

        .btn-submit {

            background-color: blueviolet;
            color: white;
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
        }

        .link {
            text-decoration: none;
            color: blueviolet;
            display: block;
            margin: 10px 0;
        }

        .forget-link {
            text-align: right;
        }

        .signup-link {
            text-align: center;
        }
    </style>

</head>

<body>

    <div class="card">

        <h2 class="form-title">Login Form</h2>

        <form>

            <label for="">Email Address</label>
            <input class="text-input" type="email">

            <label for="">Password</label>
            <input class="text-input" type="password">

            <a href="#" class="link forget-link">Forgot Password?</a>

            <button class="btn-submit">Submit</button>

            <a href="#" class="link signup-link">
                Not Registered Yet? Signup Now
            </a>

        </form>

    </div>

</body>

</html>
